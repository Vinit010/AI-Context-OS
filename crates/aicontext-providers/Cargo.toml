[package]
name = "aicontext-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Provider-neutral request and response types, the AIProvider trait, and the registry"

[lints]
workspace = true

[dependencies]
# The AIProvider trait is `async` and the registry holds heterogeneous `Box<dyn AIProvider>`; a
# native `async fn` in a trait is not dyn-compatible, so the methods are boxed. This is the macro the
# spec names (`docs/AI_PROVIDER_SPEC.md` 2) and the de-facto standard for it. Justified in
# ARCHITECTURE.md 2.2. TASK-050.
async-trait = { workspace = true }
# `Stream` and `BoxStream`, which `stream` returns (`docs/AI_PROVIDER_SPEC.md` 2). The minimal,
# runtime-agnostic home of the trait: no executor, no reactor, no tokio. TASK-050.
futures-core = { workspace = true }
# `serde_json::Value` for the fields that are deliberately opaque or provider-shaped:
# `ToolCall.arguments`, `ToolCall.raw`, and `CompletionResponse.provider_meta`
# (`docs/AI_PROVIDER_SPEC.md` 2, 2.2). Pre-justified in ARCHITECTURE.md 2.2 as "wire + file formats".
serde_json = { workspace = true }
# Error enums derive thiserror::Error, per RULES.md 4.2.
thiserror = { workspace = true }
# `time` is the three timeouts, `sync` the cancellation token, `rt` the streaming task, and `macros`
# `tokio::select!` for cancellation. Pre-justified in ARCHITECTURE.md 2.2 ("Provider HTTP ...").
# TASK-051.
tokio = { workspace = true }
# The HTTP layer for the OpenAI-compatible adapter; pre-justified in ARCHITECTURE.md 2.2. TASK-051.
reqwest = { workspace = true }
# RULES.md 6 forbids a silent retry, so each attempt is logged through the diagnostics crate
# ARCHITECTURE.md 2.2 already names. TASK-051.
tracing = { workspace = true }

# The OS keychain backend for the credential resolver. Pre-justified in ARCHITECTURE.md 2.2; the
# dependency reasoning and the RULES.md 6 analysis are on the workspace entry. TASK-052.
keyring = { workspace = true }

[dev-dependencies]
# `rt-multi-thread` is the multi-threaded flavour for `#[tokio::test]`; `macros` and `rt` already
# arrive through the library's own tokio. TASK-051.
tokio = { workspace = true, features = ["rt-multi-thread"] }
# `block_on` drives the async trait methods in tests without a runtime. TASK-050.
futures-executor = { workspace = true }
