[package]
name = "aicontext-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fixtures and workspace policy checks for AI Context OS"

[lints]
workspace = true

# `tempfile` is the only dependency this crate has, and it is added by TASK-018 to back the
# temporary-project and temporary-repository fixtures. It is already in Cargo.lock as a
# dev-dependency of aicontext-cli, so this adds no crate to the tree.
#
# The rejected alternative is ~40 lines of std::env::temp_dir() plus pid-and-counter naming plus a
# Drop impl that retries removal, which is what "we already depend on it" quietly costs: tempfile
# already handles the Windows case where a just-closed handle keeps a directory from being deleted,
# and a hand-rolled version that missed it would leave a directory behind on the platform this
# repository tests on first. See MEM-009, which recorded this crate as dependency-free before the
# fixtures existed.
[dependencies]
tempfile.workspace = true
