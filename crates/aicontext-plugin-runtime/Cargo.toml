[package]
name = "aicontext-plugin-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Approval broker and plugin runtime supervisor for AI Context OS"

[lints]
workspace = true

[dependencies]
# The permission vocabulary is defined once in core (`PermissionMode`), and the plugin error family
# is defined there too. The boundary test in aicontext-testkit permits this crate to depend on
# core, permissions, SDK, and audit. TASK-072.
aicontext-core = { path = "../aicontext-core" }
# The gateway resolves each capability with the same resolver the rest of the product uses, so the
# permission matrix is not re-described here. The boundary test permits this edge. TASK-074.
aicontext-permissions = { path = "../aicontext-permissions" }
# The supervisor speaks the published wire protocol through the SDK's `Request`, `Response`,
# `FrameCodec`, `ApiVersion`, and error types rather than re-describing them. The boundary test in
# aicontext-testkit permits this edge. TASK-073.
aicontext-plugin-sdk = { path = "../aicontext-plugin-sdk" }
# `input_schema` patterns are compiled once when the plugin is started. The schema subset is
# hand-rolled; `regex` is the only matcher it needs. Pre-justified in ARCHITECTURE.md 2.2 and
# already in the lockfile through `ignore`. TASK-074.
regex = { workspace = true }
# `exchange` is generic over the request params and the result type; the bounds are `serde`'s
# `Serialize` and `DeserializeOwned`. serde is already in the lockfile through the SDK and is
# pre-justified in ARCHITECTURE.md 2.2. TASK-073.
serde = { workspace = true }
# Arguments arrive as the parsed JSON value the plugin protocol carries, and the prompt renders them
# as compact JSON so a newline or an ANSI escape in an argument cannot forge a prompt line. Already
# in the lockfile through the SDK and the CLI. TASK-072.
serde_json = { workspace = true }
# The audit record stores `sha256:<hex>` of the arguments rather than the arguments themselves.
# Pre-justified in ARCHITECTURE.md 2.2 ("content hashing - index invalidation, audit chain,
# argument digests"); already in the lockfile through `aicontext export`. TASK-072.
sha2 = { workspace = true }
# Error enums derive thiserror::Error per RULES.md 4.2. Already in the lockfile. TASK-072.
thiserror = { workspace = true }

[dev-dependencies]
# The gateway's schema subset is cross-checked against a real Draft 2020-12 validator on every
# fixture, the same drift net `crates/aicontext-cli/src/agent/proposal.rs` uses. It is a
# dev-dependency only: the runtime does not carry a schema engine. TASK-074.
jsonschema = { workspace = true }

# A deliberately misbehaving plugin for tests/supervisor.rs. It lives outside src/ so the library
# does not expose it, and Cargo gives integration tests its path as
# CARGO_BIN_EXE_misbehaving-plugin. One binary with a mode argument keeps the fixture list in one
# place instead of adding a crate per failure mode. TASK-073.
[[bin]]
name = "misbehaving-plugin"
path = "tests/fixtures/misbehaving_plugin.rs"
test = false
doc = false
bench = false
