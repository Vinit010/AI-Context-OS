[package]
name = "aicontext-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The aicontext command-line interface"

[lints]
workspace = true

[[bin]]
name = "aicontext"
path = "src/main.rs"

[dependencies]
aicontext-context = { path = "../aicontext-context" }
aicontext-core = { path = "../aicontext-core" }
aicontext-git = { path = "../aicontext-git" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
aicontext-testkit = { path = "../aicontext-testkit" }
# Integration tests are their own crate, so a dependency they use must be a dev-dependency even when
# the binary already uses it. Asserting on the JSON envelope needs a parser.
serde_json = { workspace = true }
tempfile = { workspace = true }
# The schemas/ meta-schema check. Dev-only: nothing shipped in the binary links this.
jsonschema = { workspace = true }
