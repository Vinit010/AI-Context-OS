[workspace]
resolver = "3"
members = [
    "crates/aicontext-core",
    "crates/aicontext-context",
    "crates/aicontext-git",
    "crates/aicontext-cli",
    "crates/aicontext-permissions",
    "crates/aicontext-plugin-runtime",
    "crates/aicontext-plugin-sdk",
    "crates/aicontext-providers",
    "crates/aicontext-testkit",
]
# Crates added as their tasks land, per ARCHITECTURE.md 3:
#   aicontext-audit            (TASK-075)
# Adding a member without adding it to the boundary matrix in
# crates/aicontext-testkit/tests/crate_boundaries.rs fails `cargo test`.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Vinit010/AI-Context-OS"
authors = ["AI Context OS contributors"]
description = "Git-native context, memory, governance, and tool-integration layer for AI-assisted development"
readme = "README.md"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Lint groups must be declared at a lower priority than individual lints, or Cargo rejects the
# manifest. priority = -1 is the documented arrangement.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documented deviations from pedantic. Each needs a reason, per RULES.md 3.
#   missing_errors_doc  - our error types document remediation in code, not in a doc table
#   module_name_repetitions - `context::ContextError` is clearer than `context::Error`
missing_errors_doc = "allow"
module_name_repetitions = "allow"

# Dependencies are added by the task that needs one, never speculatively. Each needs a written
# justification in ARCHITECTURE.md 2.2.
#
#   thiserror  - error types must be enums deriving thiserror::Error (RULES.md 4.2). Added by
#                TASK-011, which defines the error model.
#   yaml_serde - the YAML front matter parser. Pinned in ADR-007 and reached only through the
#                private YamlCodec trait in aicontext-context, so R-1 is contained. TASK-016.
#   proptest   - dev-only. Generators for the round-trip tests, which is the only way to show the
#                parser survives documents nobody wrote by hand. Pre-justified in 2.2 as
#                dev-only. Added by TASK-016.
#   clap       - argument parsing for the whole command tree. Pre-justified in 2.2: hand-rolling
#                --help, -vv, and abbreviation handling for 25 commands is a bad use of effort.
#                4.6 declares rust-version 1.85, exactly our MSRV, so there is no headroom; 4.5.x
#                (MSRV 1.74) is the fallback if a transitive crate ever breaks the floor. TASK-012.
#   serde      - the CLI_SPEC 6 JSON envelope is a published contract, so it is described by
#                deriving rather than by hand-writing braces. Already in the lockfile via
#                yaml_serde, so this adds no transitive weight. TASK-012.
#   serde_json - the same envelope, serialised. TASK-012.
#   tempfile   - dev-only. Temporary project trees for the CLI integration tests, so no test reads
#                the developer's home directory or global git config (RULES.md 8). TASK-012.
#   jsonschema - dev-only. The Draft 2020-12 meta-schema check in CI. Every schema in schemas/ is
#                asserted to be a valid 2020-12 schema, because a schema nobody validated is a
#                document that fails silently on the reader it was written for. default-features is
#                false deliberately: the default set pulls in resolve-http, resolve-file and TLS
#                (reqwest/rustls/aws-lc-rs), which would drag a network stack into a workspace that
#                has none and whose schemas are self-contained by design. rust-version is exactly
#                1.85.0, our MSRV with no headroom, as with clap. TASK-015. The runtime validator
#                and the production dependency decision belong to TASK-014.
#   sha2       - per-file content digests in `aicontext export` archives and their verification on
#                `aicontext import`. Pre-justified in ARCHITECTURE.md 2.2 ("content hashing — index
#                invalidation, audit chain, argument digests. Widely audited"). A digest in a
#                portable archive has to be one an external tool can reproduce, so a
#                non-cryptographic hash would not be an honest answer; the hex encoding is six lines
#                of our own code rather than a `hex` dependency. TASK-020.
#   ignore     - file discovery that respects `.gitignore`, so the index sees exactly the documents a
#                human would, and a local scratch file in `.ai/` stays out of it without a second
#                ignore format of our own. Pre-justified in ARCHITECTURE.md 2.2 ("walking .ai/ while
#                respecting ignore files"). Pinned to 0.4: 0.4.30 is the newest release that keeps our
#                1.85 floor (0.4.33 wants 1.88), and hand-rolling the precedence rules between
#                .gitignore, .git/info/exclude and the global file is exactly the kind of correctness
#                that is cheaper to depend on than to re-derive. TASK-031.
#   async-trait - the AIProvider trait is `async` and dyn-compatible (the registry holds
#                `Box<dyn AIProvider>`), and a native async fn in a trait is neither dyn-compatible
#                nor object-safe. This is the macro docs/AI_PROVIDER_SPEC.md 2 names. TASK-050.
#   futures-core - `Stream` and `BoxStream`, which AIProvider::stream returns. The minimal,
#                runtime-agnostic home of the trait: no executor, no reactor, no tokio, so the
#                providers crate stays free of a network stack until an adapter needs one. TASK-050.
#   futures-executor - dev-only. `block_on` drives the async trait methods in tests without pulling
#                an async runtime into the workspace; tokio arrives only when TASK-051 needs it for
#                HTTP. TASK-050.
#   tokio      - the async runtime the provider contract in ARCHITECTURE.md 2.2 and 2.2's "Provider
#                HTTP" row assume; TASK-051 is the first crate to make a network call. Features are
#                per use: `time` for the three timeouts, `sync` for the cancellation token, `rt` for
#                the streaming task, and `macros` for `tokio::select!` (cancellation) and the tests'
#                `#[tokio::test]`. TASK-051. `net` is added per-crate rather than here, by whoever
#                builds a runtime of its own: TASK-053's `connect` calls `enable_all()`, and the TCP
#                driver that needs is not the providers crate's to ask for.
#   reqwest    - the HTTP client for the OpenAI-compatible adapter. default-features is false so
#                native-tls (and the system OpenSSL the sql/jsonschema comment above avoids) cannot
#                arrive; `rustls-tls` is the TLS backend ARCHITECTURE 2.2 names, and `stream` is what
#                `AIProvider::stream` reads. TASK-051.
#   tracing    - structured diagnostics, pre-justified in ARCHITECTURE.md 2.2. RULES.md 6 forbids a
#                silent retry, and tracing is how the adapter logs each attempt without printing to
#                stdout from a library. TASK-051.
#   keyring    - the OS keychain, pre-justified in ARCHITECTURE.md 2.2 ("Credential storage without
#                writing secrets to disk in our own format"). FR-16 and ADR-005 allow exactly two
#                homes for a credential, and this is the persistent one. Each backend is the OS
#                credential store and nothing else - the Windows Credential Manager (windows-sys),
#                the macOS Keychain (security-framework), or the Linux kernel keyring
#                (linux-keyutils) - so no C compiler and no third-party system library is required,
#                which is the RULES.md 6 test rustls already passes. default-features is false so the
#                D-Bus Secret Service backend cannot arrive; the three native features are chosen per
#                target. 3.6.3 declares rust-version 1.75, below our 1.85 floor, and the lockfile is
#                resolved MSRV-aware (resolver 3). TASK-052.
[workspace.dependencies]
thiserror = "2"
yaml_serde = "0.10"
proptest = "1.6"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
jsonschema = { version = "0.58", default-features = false }
sha2 = "0.10"
ignore = "0.4"
async-trait = "0.1"
futures-core = "0.3"
futures-executor = "0.3"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
# TASK-051. Both are pre-justified in ARCHITECTURE.md 2.2 ("Provider HTTP ..."). `tokio` is reached
# for `time` (the three timeouts) and `sync` (the cancellation token); `macros`/`rt` are enabled only
# by the dev-dependency, for `#[tokio::test]`. `reqwest` turns off its default features so
# `default-tls` (native-tls) cannot arrive, and turns on `rustls-tls` + `stream` (SSE).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Test and development profiles keep debug assertions, which catch logic errors the
# release build would silently perform.
[profile.dev]
debug = 1
