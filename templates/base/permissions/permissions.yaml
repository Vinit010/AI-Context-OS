# Permission policy for {{project_name}}.
#
# Default is deny: a tool with no entry here cannot run. This file is committed; the credentials it
# refers to are not. Record WHERE a credential comes from, never its value.
#
# Modes:
#   allow              run without asking
#   approval           ask the human once per call
#   explicit_approval  ask per call, naming the exact action; no session grant
#   deny               refuse
version: 1

defaults:
  # Anything not listed below is denied. Keep it that way: an allow-all default turns the whole file
  # into decoration.
  mode: deny

tools:
  # Read-only tools are the ones safe to allow by default. Everything that writes or reaches the
  # network asks first, and everything destructive asks explicitly.
  read_file:
    mode: allow
  list_directory:
    mode: allow
  search:
    mode: allow

  write_file:
    mode: approval
  run_command:
    mode: approval

  delete_file:
    mode: explicit_approval
  force_push:
    mode: explicit_approval

  # GitHub plugin (crates/aicontext-plugin-github). All seven tools are read-only, but none is
  # granted until a rule below is uncommented. Grant only what a task needs: a grant for one tool
  # does not grant another, and issue and PR bodies are untrusted data even after a grant.
  # github.repo.read:
  #   mode: allow
  # github.issue.list:
  #   mode: allow
  # github.issue.read:
  #   mode: allow
  # github.pr.read:
  #   mode: allow
  # github.branch.list:
  #   mode: allow
  # github.commit.list:
  #   mode: allow
  # github.file.read:
  #   mode: allow

# Per-integration notes: what the integration needs, and which environment variable or OS keychain
# entry each credential comes from. See the ADR on credential handling for the rules.
integrations: {}
# For the GitHub plugin, export a fine-grained, read-only GITHUB_TOKEN. The manifest records the
# variable name; never write the value here.